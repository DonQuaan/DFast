plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    runs {
        configureEach {
            if (project.hasProperty('dfast.ctl')) {
                vmArg '-Ddfast.ctl=true'
            }
        }
        bench {
            client()
            configName = 'DFast Bench'
            ideConfigGenerated false
            runDir 'run'
            vmArg "-Ddfast.bench=${project.findProperty('dfast.bench') ?: 'short'}"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(net.fabricmc.loom.task.RunGameTask).configureEach {
    def runJava = project.findProperty('dfast.runJava')
    if (runJava) {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(runJava as int)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    systemProperty 'dfast.minecraftVersion', project.minecraft_version
    systemProperty 'dfast.fabricApiVersion', project.fabric_api_version
    systemProperty 'dfast.resources', file('src/main/resources').absolutePath
}

jar {
    from('LICENSE.md') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
